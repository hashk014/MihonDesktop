[package]
name = "mihon-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36.1"
env_logger = "0.11.11"
flate2 = "1.1.9"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "rayon"] }
log = "0.4.33"
once_cell = "1.21.4"
parking_lot = "0.12.5"
rand = "0.10.2"
redb = "4.1.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json", "gzip", "brotli", "stream", "cookies", "charset", "http2"] }
rfd = "0.17.2"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
urlencoding = "2.1.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
